// Chart helpers
// ════════════════════════════════════════════
// Chart colors: 张月=blue, 陈瑶=pink, others varied
const CHART_COLORS_DEFAULT = ["#1a5fa8","#e8427a","#1a9e6a","#d07020","#7c5cbf","#0a8fa0","#c04060"];
const CHART_COLORS_DIM     = ["rgba(26,95,168,0.1)","rgba(232,66,122,0.1)","rgba(26,158,106,0.1)"];

function getChartColors(names) {
  return names.map((n,i) => {
    if (n.includes("张月")) return "#1a5fa8";
    if (n.includes("陈瑶")) return "#e8427a";
    // pick from remaining palette, skip blue/pink
    const others = ["#1a9e6a","#d07020","#7c5cbf","#0a8fa0","#c04060","#8b6914","#206090"];
    let oi = 0;
    for (let j=0;j<i;j++) { if (!names[j].includes("张月")&&!names[j].includes("陈瑶")) oi++; }
    return others[oi % others.length];
  });
}
function getChartColorsDim(names) {
  return getChartColors(names).map(c => {
    // convert hex to rgba with 0.1 alpha
    const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    return `rgba(${r},${g},${b},0.1)`;
  });
}

// Cached chart width — set once from chart-section, reused by all canvas setups
let _chartW = 0;
function getChartWidth() {
  const section = document.getElementById("chart-section");
  if (section) {
    const w = section.getBoundingClientRect().width - 32; // 16px padding each side
    if (w > 0) { _chartW = w; return w; }
  }
  return _chartW || 600;
}

function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio||1;
  const w = getChartWidth();
  const h = 280; // fixed — matches .chart-canvas-wrap height in CSS
  canvas.width  = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+"px";
  // height is controlled entirely by CSS (height:280px !important) — do NOT set style.height
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  return {ctx,w,h};
}

function drawGrid(ctx, left, top, right, bottom, steps, color) {
  ctx.strokeStyle=color; ctx.lineWidth=1;
  for (let i=0;i<=steps;i++) {
    const y=top+(bottom-top)*i/steps;
    ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke();
  }
}

function drawYLabels(ctx, left, top, bottom, minV, maxV, steps, color, fmt) {
  ctx.fillStyle=color; ctx.font="12px 'Courier New',monospace"; ctx.textAlign="right";
  for (let i=0;i<=steps;i++) {
    const v=minV+(maxV-minV)*(1-i/steps);
    const y=top+(bottom-top)*i/steps;
    ctx.fillText(fmt(v), left-6, y+4);
  }
}

function drawXLabels(ctx, labels, left, bottom, right, color) {
  ctx.fillStyle=color; ctx.font="11px 'Courier New',monospace"; ctx.textAlign="center";
  const step=Math.max(1,Math.floor(labels.length/8));
  for (let i=0;i<labels.length;i+=step) {
    const x=left+(right-left)*i/(labels.length-1||1);
    ctx.fillText(labels[i], x, bottom+16);
  }
}

function fmtNum(v) {
  if (Math.abs(v)>=10000) return (v/10000).toFixed(1)+"万";
  return v.toLocaleString();
}

// ════════════════════════════════════════════
// Data aggregation by granularity
// ════════════════════════════════════════════
function getFilteredSnapshots() {
  if (granularity === "hour") {
    const hourMap = {};
    for (const snap of allSnapshots) {
      const hk = snap.ts.substring(0,13);
      hourMap[hk] = snap;
    }
    return Object.values(hourMap).sort((a,b)=>a.ts.localeCompare(b.ts));
  }
  if (granularity === "10min") {
    // keep one snap per 10-minute bucket
    const map = {};
    for (const snap of allSnapshots) {
      const h = snap.ts.substring(11,13);
      const m = snap.ts.substring(14,16);
      const bucket = snap.ts.substring(0,14) + String(Math.floor(parseInt(m)/10)*10).padStart(2,'0');
      map[bucket] = snap;
    }
    return Object.values(map).sort((a,b)=>a.ts.localeCompare(b.ts));
  }
  if (granularity === "5min") {
    const map = {};
    for (const snap of allSnapshots) {
      const m = snap.ts.substring(14,16);
      const bucket = snap.ts.substring(0,14) + String(Math.floor(parseInt(m)/5)*5).padStart(2,'0');
      map[bucket] = snap;
    }
    return Object.values(map).sort((a,b)=>a.ts.localeCompare(b.ts));
  }
  // "1min" — return all
  return allSnapshots;
}

// ════════════════════════════════════════════
// Trend chart: bar OR line
// ════════════════════════════════════════════
function renderTrendChart() {
  const snaps = getFilteredSnapshots();
  if (snaps.length < 2) { showChartEmpty("canvas-trend","legend-trend","数据不足"); return; }
  const canvas = document.getElementById("canvas-trend");
  const {ctx,w,h} = setupCanvas(canvas);

  const pad = {l:60,r:20,t:20,b:28};
  const left=pad.l, right=w-pad.r, top=pad.t, bottom=h-pad.b;

  const names = snaps[snaps.length-1].rows.map(r=>r.name);
  const seriesMap = {};
  names.forEach(n=>{ seriesMap[n]=[]; });
  const labels=[];
  for (const snap of snaps) {
    labels.push(hm(snap.ts));
    for (const r of snap.rows) {
      if (seriesMap[r.name]!==undefined) seriesMap[r.name].push(r.votes);
    }
  }

  const allVals = Object.values(seriesMap).flat();
  const minV=Math.min(...allVals), maxV=Math.max(...allVals);
  const range=maxV-minV||1;
  const lo=minV-range*0.08, hi=maxV+range*0.08;

  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,left,top,right,bottom,5,"rgba(200,205,220,0.7)");
  drawYLabels(ctx,left,top,bottom,lo,hi,5,"#8888aa",fmtNum);
  if (labels.length>1) drawXLabels(ctx,labels,left,bottom,right,"#8888aa");

  const n = snaps.length;
  const groupW = (right-left) / (n || 1);
  const barW = Math.max(2, Math.min(groupW / names.length - 2, 20));
  const colors = getChartColors(names);
  const dimColors = getChartColorsDim(names);

  if (trendMode === "bar") {
    names.forEach((name,ni) => {
      const series = seriesMap[name];
      series.forEach((v,i) => {
        const cx = left + groupW*i + groupW/2 + (ni-(names.length-1)/2)*(barW+2);
        const barH = Math.abs((bottom-top)*((v-lo)/(hi-lo)));
        const y = bottom - barH;
        ctx.fillStyle = colors[ni];
        ctx.globalAlpha = 0.82;
        ctx.fillRect(cx-barW/2, y, barW, Math.max(barH,1));
        ctx.globalAlpha = 1;
      });
    });
  } else {
    // line mode
    names.forEach((name,ni) => {
      const series = seriesMap[name];
      if (!series.length) return;
      const color = colors[ni];
      const pts = series.map((v,i) => ({
        x: left+(right-left)*i/(series.length-1||1),
        y: top+(bottom-top)*(1-(v-lo)/(hi-lo))
      }));
      // fill area
      ctx.beginPath();
      ctx.moveTo(pts[0].x,bottom);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,bottom);
      ctx.closePath();
      ctx.fillStyle = dimColors[ni]||"rgba(100,100,200,0.05)";
      ctx.fill();
      // smooth line
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for (let i=1;i<pts.length;i++) {
        const mx=(pts[i-1].x+pts[i].x)/2;
        ctx.bezierCurveTo(mx,pts[i-1].y,mx,pts[i].y,pts[i].x,pts[i].y);
      }
      ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
      // last dot
      const lp=pts[pts.length-1];
      ctx.beginPath(); ctx.arc(lp.x,lp.y,4,0,Math.PI*2);
      ctx.fillStyle=color; ctx.fill();
    });
  }

  const leg=document.getElementById("legend-trend");
  const trendColors=getChartColors(names);
  leg.innerHTML=names.map((n,i)=>
    `<div class="legend-item">
      <div class="${trendMode==='bar'?'legend-rect':'legend-dot'}" style="background:${trendColors[i]}"></div>${n}
    </div>`
  ).join("")+`<div class="legend-item" style="margin-left:auto;color:var(--text3)">${snaps.length} 个数据点</div>`;
}

// ════════════════════════════════════════════
// Delta chart: bar OR line
// ════════════════════════════════════════════
function renderDeltaChart() {
  const snaps = getFilteredSnapshots();
  if (snaps.length < 2) { showChartEmpty("canvas-delta","legend-delta","数据不足"); return; }
  const canvas=document.getElementById("canvas-delta");
  const {ctx,w,h}=setupCanvas(canvas);

  const names=snaps[snaps.length-1].rows.map(r=>r.name);
  const labels=[];
  const seriesMap={};
  names.forEach(n=>{ seriesMap[n]=[]; });

  for (let i=1;i<snaps.length;i++) {
    const snap=snaps[i];
    labels.push(hm(snap.ts));
    if (granularity==="10min") {
      // delta from previous snap
      const prevSnap=snaps[i-1];
      const prevMap=Object.fromEntries(prevSnap.rows.map(r=>[r.name,r.votes]));
      for (const r of snap.rows) {
        if (seriesMap[r.name]!==undefined)
          seriesMap[r.name].push(prevMap[r.name]!==undefined ? r.votes-prevMap[r.name] : null);
      }
    } else {
      // hour mode: delta from start of that hour
      const hk=snap.ts.substring(0,13);
      const hourSnap=allSnapshots.find(s=>s.ts.startsWith(hk)) || snaps[i-1];
      const hourMap=Object.fromEntries(hourSnap.rows.map(r=>[r.name,r.votes]));
      for (const r of snap.rows) {
        if (seriesMap[r.name]!==undefined)
          seriesMap[r.name].push(hourMap[r.name]!==undefined ? r.votes-hourMap[r.name] : null);
      }
    }
  }

  const allVals=Object.values(seriesMap).flat().filter(v=>v!==null);
  if (!allVals.length) { showChartEmpty("canvas-delta","legend-delta","暂无涨幅数据"); return; }
  const maxV=Math.max(...allVals,0), minV=Math.min(...allVals,0);

  const pad={l:72,r:20,t:24,b:32};
  const left=pad.l, right=w-pad.r, top=pad.t, bottom=h-pad.b;
  const n=labels.length;
  const groupW=(right-left)/(n||1);
  const barW=Math.max(2,Math.min(groupW/names.length-2,18));

  // Smart Y-axis with nice round ticks
  function niceRange(lo0, hi0) {
    const rawRange = hi0 - lo0 || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(rawRange)) - 1);
    const step = Math.ceil(rawRange / (5 * mag)) * mag;
    let lo = Math.floor(lo0 / step) * step;
    let hi = Math.ceil(hi0 / step) * step;
    if (minV >= 0 && lo < 0) lo = 0;
    return { lo, hi, step };
  }
  const { lo, hi, step } = niceRange(minV - (maxV - minV) * 0.08, maxV + (maxV - minV) * 0.18 + 1);
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.001; v += step) ticks.push(Math.round(v));

  const zeroY=top+(bottom-top)*(1-(0-lo)/(hi-lo));
  const alertThresh=granularity==="10min"?ALERT_10MIN:ALERT_HOURLY;
  const deltaColors = getChartColors(names);

  ctx.clearRect(0,0,w,h);

  // Grid at ticks
  ctx.strokeStyle="rgba(200,205,220,0.7)"; ctx.lineWidth=1;
  ticks.forEach(v => {
    const y=top+(bottom-top)*(1-(v-lo)/(hi-lo));
    if (y>=top&&y<=bottom) { ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke(); }
  });

  // Y labels
  ctx.fillStyle="#8888aa"; ctx.font="11px 'Courier New',monospace"; ctx.textAlign="right";
  ticks.forEach(v => {
    const y=top+(bottom-top)*(1-(v-lo)/(hi-lo));
    if (y>=top-2&&y<=bottom+2) ctx.fillText((v>=0?"+":"")+fmtNum(v), left-6, y+4);
  });

  // X labels
  if (labels.length>1) drawXLabels(ctx,labels,left,bottom,right,"#8888aa");

  // zero line
  ctx.strokeStyle="rgba(100,100,150,0.35)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(left,zeroY); ctx.lineTo(right,zeroY); ctx.stroke();

  // alert line
  const alertY=top+(bottom-top)*(1-(alertThresh-lo)/(hi-lo));
  if (alertY>top&&alertY<bottom) {
    ctx.strokeStyle="rgba(217,48,80,0.45)"; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(left,alertY); ctx.lineTo(right,alertY); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle="rgba(217,48,80,0.65)";
    ctx.font="10px monospace"; ctx.textAlign="left";
    ctx.fillText("预警线",left+4,alertY-4);
  }

  if (deltaMode==="bar") {
    names.forEach((name,ni)=>{
      const series=seriesMap[name];
      series.forEach((v,i)=>{
        if (v===null) return;
        const cx=left+groupW*i+groupW/2+(ni-(names.length-1)/2)*(barW+2);
        const barH=Math.abs((bottom-top)*((v-0)/(hi-lo)));
        const y=v>=0?zeroY-barH:zeroY;
        ctx.fillStyle=deltaColors[ni];
        ctx.globalAlpha=v>=alertThresh?1:0.72;
        ctx.fillRect(cx-barW/2,y,barW,Math.max(barH,1));
        ctx.globalAlpha=1;
      });
    });
  } else {
    // line
    names.forEach((name,ni)=>{
      const series=seriesMap[name];
      const pts=[];
      series.forEach((v,i)=>{ if(v!==null) pts.push({x:left+groupW*(i+0.5),y:top+(bottom-top)*(1-(v-lo)/(hi-lo))}); });
      if (pts.length<2) return;
      // fill area under line
      const dimColor=getChartColorsDim(names)[ni];
      ctx.beginPath();
      ctx.moveTo(pts[0].x,zeroY);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,zeroY);
      ctx.closePath();
      ctx.fillStyle=dimColor; ctx.fill();
      // smooth line
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for (let i=1;i<pts.length;i++) {
        const mx=(pts[i-1].x+pts[i].x)/2;
        ctx.bezierCurveTo(mx,pts[i-1].y,mx,pts[i].y,pts[i].x,pts[i].y);
      }
      ctx.strokeStyle=deltaColors[ni]; ctx.lineWidth=2; ctx.globalAlpha=0.9; ctx.stroke();
      ctx.globalAlpha=1;
      // dots
      pts.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fillStyle="#fff"; ctx.fill();
        ctx.strokeStyle=deltaColors[ni]; ctx.lineWidth=1.5; ctx.stroke();
      });
    });
  }

  const leg=document.getElementById("legend-delta");
  leg.innerHTML=names.map((nm,i)=>
    `<div class="legend-item">
      <div class="${deltaMode==='line'?'legend-dot':'legend-rect'}" style="background:${deltaColors[i]}"></div>${nm}
    </div>`
  ).join("")+
  `<div class="legend-item" style="margin-left:auto;color:var(--text3)">${n} 个数据点 · ${granularity==="10min"?"10分钟粒度":granularity==="5min"?"5分钟粒度":granularity==="1min"?"1分钟粒度":"整小时粒度"}</div>`;
}

// ════════════════════════════════════════════
// Daily chart: bar (per-day gain) OR line (cross-day trend)
// ════════════════════════════════════════════
function renderDailyChart() {
  const canvas = document.getElementById("canvas-daily");
  const leg = document.getElementById("legend-daily");
  const stats = getDailyStats();
  if (!stats.length) { showChartEmpty("canvas-daily","legend-daily","暂无每日数据"); return; }

  const {ctx,w,h} = setupCanvas(canvas);
  const pad = {l:72,r:20,t:24,b:32};
  const left=pad.l, right=w-pad.r, top=pad.t, bottom=h-pad.b;

  // Get unique days sorted
  const days = [...new Set(stats.map(s=>s.date))].sort();
  // Get unique names
  const names = [...new Set(stats.map(s=>s.name))];
  const colors = getChartColors(names);
  const dimColors = getChartColorsDim(names);

  if (dailyChartMode === "bar") {
    // Bar chart: each day's total gain per person
    const seriesMap = {};
    names.forEach(n => { seriesMap[n] = []; });
    for (const d of days) {
      for (const nm of names) {
        const row = stats.find(s => s.date===d && s.name===nm);
        seriesMap[nm].push(row ? row.gain : 0);
      }
    }

    const allVals = Object.values(seriesMap).flat();
    const maxV = Math.max(...allVals, 0);
    const minV = Math.min(...allVals, 0);

    function niceRange(lo0,hi0) {
      const rawRange=hi0-lo0||1;
      const mag=Math.pow(10,Math.floor(Math.log10(rawRange))-1);
      const step=Math.ceil(rawRange/(5*mag))*mag;
      let lo=Math.floor(lo0/step)*step;
      let hi=Math.ceil(hi0/step)*step;
      if (minV>=0&&lo<0) lo=0;
      return {lo,hi,step};
    }
    const {lo,hi,step} = niceRange(minV-(maxV-minV)*0.05, maxV+(maxV-minV)*0.18+1);
    const ticks=[]; for(let v=lo;v<=hi+step*0.001;v+=step) ticks.push(Math.round(v));

    const zeroY = top+(bottom-top)*(1-(0-lo)/(hi-lo));
    const n = days.length;
    const groupW = (right-left)/(n||1);
    const barW = Math.max(3, Math.min(groupW/names.length-2, 28));

    ctx.clearRect(0,0,w,h);

    // Grid
    ctx.strokeStyle="rgba(200,205,220,0.7)"; ctx.lineWidth=1;
    ticks.forEach(v=>{
      const y=top+(bottom-top)*(1-(v-lo)/(hi-lo));
      if(y>=top&&y<=bottom){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();}
    });
    // Y labels
    ctx.fillStyle="#8888aa"; ctx.font="11px 'Courier New',monospace"; ctx.textAlign="right";
    ticks.forEach(v=>{
      const y=top+(bottom-top)*(1-(v-lo)/(hi-lo));
      if(y>=top-2&&y<=bottom+2) ctx.fillText((v>=0?"+":"")+fmtNum(v),left-6,y+4);
    });
    // X labels (dates)
    ctx.fillStyle="#8888aa"; ctx.font="11px 'Courier New',monospace"; ctx.textAlign="center";
    const step2=Math.max(1,Math.floor(days.length/6));
    days.forEach((d,i)=>{if(i%step2===0){const x=left+groupW*i+groupW/2;ctx.fillText(d.substring(5),x,bottom+16);}});

    // Zero line
    ctx.strokeStyle="rgba(100,100,150,0.35)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(left,zeroY); ctx.lineTo(right,zeroY); ctx.stroke();

    // Bars
    names.forEach((name,ni)=>{
      const series=seriesMap[name];
      series.forEach((v,i)=>{
        const cx=left+groupW*i+groupW/2+(ni-(names.length-1)/2)*(barW+2);
        const barH=Math.abs((bottom-top)*((v-0)/(hi-lo)));
        const y=v>=0?zeroY-barH:zeroY;
        ctx.fillStyle=colors[ni];
        ctx.globalAlpha=0.82;
        ctx.fillRect(cx-barW/2,y,barW,Math.max(barH,1));
        ctx.globalAlpha=1;
      });
    });

    leg.innerHTML = names.map((nm,i)=>
      `<div class="legend-item"><div class="legend-rect" style="background:${colors[i]}"></div>${nm}</div>`
    ).join("")+`<div class="legend-item" style="margin-left:auto;color:var(--text3)">${days.length} 天数据 · 每日总涨幅</div>`;

  } else {
    // Line chart: cross-day vote count trend (end-of-day votes)
    const seriesMap = {};
    names.forEach(n => { seriesMap[n] = []; });
    for (const d of days) {
      for (const nm of names) {
        const row = stats.find(s => s.date===d && s.name===nm);
        seriesMap[nm].push(row ? row.endVotes : null);
      }
    }

    const allVals = Object.values(seriesMap).flat().filter(v=>v!==null);
    if (!allVals.length) { showChartEmpty("canvas-daily","legend-daily","暂无数据"); return; }
    const minV=Math.min(...allVals), maxV=Math.max(...allVals);
    const range=maxV-minV||1;
    const lo=minV-range*0.08, hi=maxV+range*0.08;

    ctx.clearRect(0,0,w,h);
    drawGrid(ctx,left,top,right,bottom,5,"rgba(200,205,220,0.7)");
    drawYLabels(ctx,left,top,bottom,lo,hi,5,"#8888aa",fmtNum);
    // X labels (dates)
    ctx.fillStyle="#8888aa"; ctx.font="11px 'Courier New',monospace"; ctx.textAlign="center";
    const step2=Math.max(1,Math.floor(days.length/6));
    days.forEach((d,i)=>{if(i%step2===0||i===days.length-1){const x=left+(right-left)*i/(days.length-1||1);ctx.fillText(d.substring(5),x,bottom+16);}});

    names.forEach((name,ni)=>{
      const series = seriesMap[name];
      const pts=[];
      series.forEach((v,i)=>{
        if(v!==null) pts.push({x:left+(right-left)*i/(days.length-1||1), y:top+(bottom-top)*(1-(v-lo)/(hi-lo))});
      });
      if(pts.length<1) return;
      // fill
      ctx.beginPath();
      ctx.moveTo(pts[0].x,bottom);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,bottom);
      ctx.closePath();
      ctx.fillStyle=dimColors[ni]; ctx.fill();
      if(pts.length>=2){
        ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++){const mx=(pts[i-1].x+pts[i].x)/2;ctx.bezierCurveTo(mx,pts[i-1].y,mx,pts[i].y,pts[i].x,pts[i].y);}
        ctx.strokeStyle=colors[ni]; ctx.lineWidth=2.5; ctx.stroke();
      }
      pts.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2);
        ctx.fillStyle="#fff"; ctx.fill();
        ctx.strokeStyle=colors[ni]; ctx.lineWidth=2; ctx.stroke();
      });
    });

    leg.innerHTML = names.map((nm,i)=>
      `<div class="legend-item"><div class="legend-dot" style="background:${colors[i]}"></div>${nm}</div>`
    ).join("")+`<div class="legend-item" style="margin-left:auto;color:var(--text3)">${days.length} 天 · 每日末票数趋势</div>`;
  }
}


function showChartEmpty(canvasId, legendId, msg) {
  const canvas=document.getElementById(canvasId);
  if (canvas) { const {ctx,w,h}=setupCanvas(canvas); ctx.clearRect(0,0,w,h); }
  const leg=document.getElementById(legendId);
  if (leg) leg.innerHTML=`<span style="color:var(--text3);font-size:0.75rem">${msg}</span>`;
}

function renderAllCharts() {
  if (allSnapshots.length<2) return;
  document.getElementById("chart-title").style.display="";
  document.getElementById("chart-section").style.display="";
  const active=document.querySelector(".chart-panel.active")?.id;
  if (active==="panel-trend") renderTrendChart();
  if (active==="panel-delta") renderDeltaChart();
  if (active==="panel-daily-chart") renderDailyChart();
}

document.getElementById("btn-fetch-now").addEventListener("click",async()=>{
  await doFetch();
  if (running) { clearInterval(timerId); startCountdown(); timerId=setInterval(async()=>{ if(!running)return; await doFetch(); startCountdown(); },INTERVAL_MS); }
});
document.getElementById("btn-clear-notify").addEventListener("click",()=>{
  notifyLines.length=0;
  notifyLines1min.length=0;
  notifyLines5min.length=0;
  notifyLines10min.length=0;
  notifyLinesHour.length=0;
  refreshNotifyFeed();
});

// PWA
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById("install-banner").classList.remove("hidden");
  document.getElementById("install-banner").style.display="flex";
});
document.getElementById("btn-install").addEventListener("click",async()=>{
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById("install-banner").classList.add("hidden");
});
document.getElementById("btn-close-banner").addEventListener("click",()=>{
  document.getElementById("install-banner").classList.add("hidden");
});

window.addEventListener("offline",()=>{ if (!running) setStatus("offline","离线模式"); });
window.addEventListener("online", ()=>{ if (running)  setStatus("running","追踪中"); });

// ════════════════════════════════════════════
// Init
// ════════════════════════════════════════════
(async()=>{
  await openDB();
  allSnapshots=await dbGetAll("snapshots");
  allSnapshots.sort((a,b)=>a.ts.localeCompare(b.ts));

  if (allSnapshots.length>0) {
    const last=allSnapshots[allSnapshots.length-1];
    const prevSnap=allSnapshots.find(s=>s.ts===last.prevTs);
    const hourSnap=allSnapshots.find(s=>s.ts===last.hourStartTs);
    renderCards(last.rows, prevSnap, hourSnap, last.ts);
    renderSummaryBar(last.rows, last.ts);
    renderWatchlist(last.watchRows||[], prevSnap);
    renderDiffRow([...last.rows,...(last.watchRows||[])]);
    document.getElementById("last-update-label").textContent=`更新于 ${last.ts.substring(11,16)}`;
    document.getElementById("diff-row").style.display="";
  }
  renderHistoryTable();
  renderDailyPanel();
  renderAllCharts();
  setGran("1min");
  document.getElementById("total-count").textContent=allSnapshots.length+" 次";
  rebuildNotifyFromHistory();

  // 从云端恢复历史数据，完成后自动启动追踪
  await loadFromKV();
  startTracking();

  if ("serviceWorker" in navigator) {
    // 版本号：每次更新 index.html 时修改此字符串，SW 会自动清除旧缓存
    const APP_VERSION = "2026-06-11-v7";

    navigator.serviceWorker.register("sw.js").then(reg => {
      // 把版本号传给 SW，SW 用它作为缓存 key
      const sendVer = (sw) => sw && sw.postMessage({ type: "SET_VERSION", version: APP_VERSION });

      if (reg.active)   sendVer(reg.active);
      if (reg.waiting)  { sendVer(reg.waiting); reg.waiting.postMessage({ type: "SKIP_WAITING" }); }
      if (reg.installing) {
        reg.installing.addEventListener("statechange", e => {
          if (e.target.state === "installed") {
            sendVer(e.target);
            e.target.postMessage({ type: "SKIP_WAITING" });
          }
        });
      }
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        sw.addEventListener("statechange", e => {
          if (e.target.state === "installed") {
            sendVer(e.target);
            e.target.postMessage({ type: "SKIP_WAITING" });
            // 新 SW 接管后静默刷新，用户无感知
            navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
          }
        });
      });
    }).catch(()=>{});
  }
})();
</script>
