<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="乘风追票">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<title>乘风2026 · 投票追踪</title>
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #f0f1f5;
    --border: #d8dae8;
    --accent: #e63b6e;
    --accent2: #5a6fc4;
    --gold: #b8860b;
    --text: #1a1a2e;
    --text2: #4a4a6a;
    --text3: #8888aa;
    --green: #1a9e6a;
    --red: #d93050;
    --orange: #d07020;
    --font-display: 'Noto Serif SC', serif;
    --font-body: 'Noto Sans SC', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --r: 10px;
    --r2: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: linear-gradient(135deg, #ffffff 0%, #f0f2fa 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .logo { display: flex; align-items: baseline; gap: 8px; }
  .logo-main {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 1.3rem;
    background: linear-gradient(135deg, #1a5fa8, #e63b6e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.05em;
  }
  .logo-sub { font-size: 0.7rem; color: var(--text3); letter-spacing: 0.1em; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .status-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 500;
    border: 1px solid transparent; transition: all 0.3s;
  }
  .status-pill.running { background: rgba(26,158,106,0.1); border-color: rgba(26,158,106,0.4); color: var(--green); }
  .status-pill.paused  { background: rgba(217,48,80,0.1);  border-color: rgba(217,48,80,0.3);  color: var(--red); }
  .status-pill.offline { background: rgba(136,136,170,0.1); border-color: rgba(136,136,170,0.3); color: var(--text2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
  .status-pill.paused .dot, .status-pill.offline .dot { animation: none; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

  .container { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }

  /* countdown */
  .countdown-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .countdown-label { font-size: 0.75rem; color: var(--text2); }
  .countdown-timer { font-family: var(--font-mono); font-size: 1.1rem; color: var(--gold); letter-spacing: 0.05em; min-width: 50px; text-align: right; }
  .progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 2px; transition: width 1s linear; }
  .btn-group { display: flex; gap: 8px; }
  .btn { padding: 7px 14px; border-radius: var(--r2); font-size: 0.78rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; font-family: var(--font-body); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #c2224e; border-color: #c2224e; }
  .btn-secondary { background: transparent; color: var(--text2); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--text2); color: var(--text); }
  .btn-active { background: rgba(26,95,168,0.08); color: #1a5fa8; border-color: #1a5fa8; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* rank cards */
  .rank-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  @media(max-width:600px) { .rank-grid { grid-template-columns: 1fr; } }
  .rank-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 18px 16px 14px;
    position: relative; overflow: hidden; transition: border-color 0.2s;
  }
  .rank-card.alert { border-color: var(--red); animation: alertglow 1s ease-in-out 3; }
  .rank-card.warn  { border-color: var(--orange); }
  @keyframes alertglow { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 20px rgba(217,48,80,0.25)} }
  .rank-badge { position: absolute; top: 12px; right: 14px; font-size: 0.7rem; color: var(--text3); font-family: var(--font-mono); }
  .rank-name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; margin-bottom: 8px; letter-spacing: 0.05em; }
  .rank-votes { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; color: var(--gold); letter-spacing: -0.02em; margin-bottom: 10px; }
  .rank-deltas { display: flex; flex-direction: column; gap: 4px; }
  .delta-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; }
  .delta-label { color: var(--text3); }
  .delta-val { font-family: var(--font-mono); }
  .delta-val.pos { color: var(--green); }
  .delta-val.neg { color: var(--red); }
  .delta-val.neutral { color: var(--text2); }
  .alert-badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: rgba(217,48,80,0.08); color: var(--red);
    border: 1px solid rgba(217,48,80,0.3); border-radius: 4px;
    padding: 1px 6px; font-size: 0.65rem; margin-top: 6px;
  }
  .warn-badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: rgba(208,112,32,0.08); color: var(--orange);
    border: 1px solid rgba(208,112,32,0.3); border-radius: 4px;
    padding: 1px 6px; font-size: 0.65rem; margin-top: 6px;
  }

  /* alert toast */
  #alert-toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(217,48,80,0.95); color: #fff;
    border-radius: var(--r); padding: 12px 20px;
    font-size: 0.85rem; font-weight: 600;
    box-shadow: 0 4px 24px rgba(217,48,80,0.3);
    z-index: 9999; display: none; max-width: 90vw; text-align: center;
    animation: toastIn 0.3s ease;
  }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* diff row */
  .diff-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 12px 16px;
    display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .diff-item { display: flex; flex-direction: column; gap: 2px; }
  .diff-label { font-size: 0.7rem; color: var(--text3); }
  .diff-value { font-family: var(--font-mono); font-size: 1rem; color: var(--text); }

  /* summary bar (1/5/10 min quick view) */
  .summary-bar {
    background: linear-gradient(135deg, #1a1a3e 0%, #0f2040 100%);
    border: 1px solid rgba(90,111,196,0.4);
    border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .summary-bar-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .summary-bar-title { font-size: 0.72rem; color: rgba(200,210,255,0.7); letter-spacing: 0.1em; text-transform: uppercase; }
  .summary-win-btns { display: flex; gap: 4px; }
  .summary-win-btn {
    padding: 2px 9px; border-radius: 12px; font-size: 0.68rem; font-family: var(--font-mono);
    cursor: pointer; border: 1px solid rgba(90,111,196,0.4); background: transparent;
    color: rgba(200,210,255,0.6); transition: all 0.2s;
  }
  .summary-win-btn:hover { color: #fff; border-color: rgba(90,111,196,0.8); }
  .summary-win-btn.active { background: rgba(90,111,196,0.35); color: #fff; border-color: #5a6fc4; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media(max-width:600px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(90,111,196,0.2);
    border-radius: 8px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .summary-card-left { display: flex; flex-direction: column; gap: 2px; }
  .summary-card-rank { font-size: 0.62rem; color: rgba(200,210,255,0.5); font-family: var(--font-mono); }
  .summary-card-name { font-family: var(--font-display); font-size: 0.92rem; color: #e8eeff; font-weight: 700; }
  .summary-card-votes { font-family: var(--font-mono); font-size: 0.75rem; color: rgba(200,210,255,0.55); }
  .summary-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .summary-delta-big { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; }
  .summary-delta-big.pos { color: #4de88e; }
  .summary-delta-big.neg { color: #ff6070; }
  .summary-delta-big.neutral { color: rgba(200,210,255,0.5); }
  .summary-rate { font-size: 0.62rem; color: rgba(200,210,255,0.45); font-family: var(--font-mono); }
  .summary-alert-tag {
    font-size: 0.6rem; background: rgba(217,48,80,0.25); color: #ff8090;
    border: 1px solid rgba(217,48,80,0.4); border-radius: 3px; padding: 0 5px; margin-top: 2px;
  }

  /* interval selector */
  .interval-selector { display: flex; align-items: center; gap: 6px; }
  .interval-label { font-size: 0.7rem; color: var(--text3); }

  /* daily summary panel */
  .daily-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); margin-bottom: 16px; overflow: hidden;
  }
  .daily-panel-header {
    background: var(--surface2); border-bottom: 1px solid var(--border);
    padding: 9px 14px; display: flex; align-items: center; justify-content: space-between;
  }
  .daily-panel-title { font-size: 0.73rem; color: var(--text2); font-weight: 500; letter-spacing: 0.05em; }
  .daily-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .daily-table thead th {
    background: var(--surface2); padding: 7px 12px; text-align: left;
    color: var(--text3); font-weight: 500; font-size: 0.7rem;
    letter-spacing: 0.05em; border-bottom: 1px solid var(--border);
  }
  .daily-table tbody tr { border-bottom: 1px solid rgba(216,218,232,0.6); transition: background 0.15s; }
  .daily-table tbody tr:last-child { border-bottom: none; }
  .daily-table tbody tr:hover { background: var(--surface2); }
  .daily-table td { padding: 7px 12px; vertical-align: middle; }
  .day-badge {
    display: inline-block; background: rgba(26,95,168,0.08); color: #1a5fa8;
    border: 1px solid rgba(26,95,168,0.2); border-radius: 4px;
    padding: 1px 7px; font-family: var(--font-mono); font-size: 0.7rem;
  }

  /* history filter row */
  .history-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .history-filter select {
    font-size: 0.72rem; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: var(--font-body);
  }

  /* watchlist */
  .watchlist-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 10px 16px; margin-bottom: 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .watchlist-label { font-size: 0.72rem; color: var(--text3); white-space: nowrap; }
  .watchlist-items { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .watch-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 10px; font-size: 0.7rem; font-family: var(--font-mono);
  }
  .watch-chip.surging { border-color: var(--orange); background: rgba(208,112,32,0.08); }
  .watch-chip .chip-name { color: var(--text2); }
  .watch-chip .chip-rank { color: var(--text3); }
  .watch-chip .chip-delta { color: var(--green); }
  .watch-chip.surging .chip-name { color: var(--orange); }

  /* section title */
  .section-title {
    font-size: 0.75rem; letter-spacing: 0.12em; color: var(--text3);
    text-transform: uppercase; margin-bottom: 10px; padding-left: 2px;
    display: flex; align-items: center; justify-content: space-between;
  }

  /* history table */
  .history-table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; margin-bottom: 16px;
    max-height: 420px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .history-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .history-table thead th {
    background: var(--surface2); padding: 9px 12px; text-align: left;
    color: var(--text3); font-weight: 500; font-size: 0.7rem;
    letter-spacing: 0.05em; border-bottom: 1px solid var(--border);
  }
  .history-table tbody tr { border-bottom: 1px solid rgba(216,218,232,0.8); transition: background 0.15s; }
  .history-table tbody tr:last-child { border-bottom: none; }
  .history-table tbody tr:hover { background: var(--surface2); }
  .history-table td { padding: 8px 12px; vertical-align: middle; }
  .td-mono { font-family: var(--font-mono); }
  .td-pos { color: var(--green); }
  .td-neg { color: var(--red); }
  .td-neutral { color: var(--text2); }
  .td-alert { color: var(--red); font-size: 0.65rem; background: rgba(217,48,80,0.08); padding: 1px 5px; border-radius: 3px; }
  .td-warn  { color: var(--orange); font-size: 0.65rem; background: rgba(208,112,32,0.08); padding: 1px 5px; border-radius: 3px; }

  /* export */
  .export-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .export-label { font-size: 0.8rem; color: var(--text2); }
  .export-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* notify feed */
  .notify-feed {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); max-height: 260px; overflow-y: auto;
    font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.7;
    color: var(--text2); padding: 12px 14px; margin-bottom: 16px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .notify-feed .nf-time  { color: var(--text3); }
  .notify-feed .nf-alert { color: var(--red); }
  .notify-feed .nf-warn  { color: var(--orange); }
  .notify-feed .nf-info  { color: var(--green); }
  .notify-feed .nf-sep   { color: var(--border); }
  .notify-entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .notify-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  /* empty */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
  .empty-state .es-icon { font-size: 2rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.82rem; line-height: 1.6; }

  .last-update { font-size: 0.7rem; color: var(--text3); font-family: var(--font-mono); }

  /* install banner */
  #install-banner { display:none; background: linear-gradient(135deg, #5a6fc4, #e63b6e); color: #fff; padding: 10px 16px; font-size: 0.78rem; align-items: center; justify-content: space-between; gap: 10px; }
  #install-banner.hidden { display: none !important; }
  #install-banner .ib-text { flex: 1; }
  #install-banner .ib-close { background: transparent; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 1rem; padding: 0 4px; }

  /* chart section */
  .chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface2); padding-right: 12px; }
  .chart-tabs { display: flex; }
  .chart-tab {
    padding: 9px 18px; font-size: 0.75rem; color: var(--text3);
    cursor: pointer; border: none; background: transparent;
    border-bottom: 2px solid transparent; transition: all 0.2s;
    font-family: var(--font-body); letter-spacing: 0.03em;
  }
  .chart-tab:hover { color: var(--text2); }
  .chart-tab.active { color: var(--text); border-bottom-color: #1a5fa8; }
  .chart-controls { display: flex; gap: 6px; }
  .chart-mode-btn {
    padding: 4px 10px; border-radius: var(--r2); font-size: 0.7rem;
    cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--text3); font-family: var(--font-body);
    transition: all 0.2s;
  }
  .chart-mode-btn:hover { color: var(--text2); border-color: var(--text3); }
  .chart-mode-btn.active { background: rgba(26,95,168,0.1); color: #1a5fa8; border-color: #1a5fa8; }
  .chart-panel { display: none; padding: 16px 16px 12px; }
  .chart-panel.active { display: block; }
  .chart-canvas-wrap { position: relative; width: 100%; height: 280px; }
  .chart-canvas-wrap canvas { width: 100% !important; height: 280px !important; display: block; }
  .chart-sub-controls { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .granularity-label { font-size: 0.7rem; color: var(--text3); margin-right: 2px; }
  .chart-legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-rect { width: 12px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .chart-empty { text-align: center; padding: 50px 20px; color: var(--text3); font-size: 0.82rem; }

  /* export chart btn */
  .btn-export-chart {
    padding: 4px 10px; border-radius: var(--r2); font-size: 0.7rem;
    cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--text3); font-family: var(--font-body);
    transition: all 0.2s; margin-left: 8px;
  }
  .btn-export-chart:hover { color: #1a5fa8; border-color: #1a5fa8; background: rgba(26,95,168,0.06); }

  /* beijing clock */
  .bjt-clock { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text3); padding: 0 4px; }
</style>
</head>
<body>

<div id="alert-toast"></div>

<div id="install-banner" class="hidden">
  <span class="ib-text">📲 添加到主屏幕，离线也能追票！</span>
  <button class="btn btn-primary" id="btn-install" style="font-size:0.72rem;padding:5px 10px;">安装</button>
  <button class="ib-close" id="btn-close-banner">✕</button>
</div>

<header>
  <div class="logo">
    <span class="logo-main">乘风2026</span>
    <span class="logo-sub">投票追踪</span>
  </div>
  <div class="header-right">
    <span class="bjt-clock" id="bjt-clock">北京 --:--:--</span>
    <span style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text3);opacity:0.6" title="当前网页版本">v7</span>
    <span class="last-update" id="last-update-label">—</span>
    <div class="status-pill offline" id="status-pill">
      <div class="dot"></div>
      <span id="status-text">未启动</span>
    </div>
  </div>
</header>

<div class="container">

  <!-- countdown -->
  <div class="countdown-bar">
    <span class="countdown-label">下次抓取</span>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <span class="countdown-timer" id="countdown-timer">—</span>
    <div class="interval-selector">
      <span class="interval-label">间隔</span>
      <select id="interval-select" style="font-size:0.72rem;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-body)">
        <option value="60000">1分钟</option>
        <option value="300000">5分钟</option>
        <option value="600000" selected>10分钟</option>
      </select>
    </div>
    <div class="btn-group">

<script>
// ════════════════════════════════════════════
// 常量
// ════════════════════════════════════════════
const API_URL     = "https://vote.api.mgtv.com/chengfeng/query_vote_list?os=win&did=f86d8e2a-eaa6-4878-a689-579d6dec2555&source=share_cf_zj_2026&invoker=mobile-zhipubao&appVersion=6.9.9_vipact&mac=f86d8e2a-eaa6-4878-a689-579d6dec2555&version=6.9.9_vipact";
const WORKER_URL  = "https://cf2026.one1seven799.workers.dev";
let INTERVAL_MS   = 10 * 60 * 1000;  // dynamic — changed by interval-select
const ALERT_10MIN  = 18000;
const ALERT_HOURLY = 100000;
// 5-9名涨幅异常预警（10分钟内涨这么多就提示要冲进前四）
const ALERT_WATCH_10MIN  = 15000;
const DB_NAME      = "cf2026v2";
const DB_VERSION   = 3;

// ════════════════════════════════════════════
// 北京时间工具（UTC+8，不依赖本机时区）
// ════════════════════════════════════════════
function getCSTDate() {
  // Always compute UTC+8 regardless of local timezone
  const utcMs = Date.now();
  return new Date(utcMs + 8 * 3600 * 1000);
}

function fmtCSTDate(d) {
  // d is a Date whose UTC fields represent CST time
  const y = d.getUTCFullYear();
  const M = String(d.getUTCMonth()+1).padStart(2,'0');
  const D = String(d.getUTCDate()).padStart(2,'0');
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  const s = String(d.getUTCSeconds()).padStart(2,'0');
  return `${y}-${M}-${D} ${h}:${m}:${s}`;
}

function hm(ts) { return ts.substring(11,16); }

// Live clock
setInterval(() => {
  document.getElementById("bjt-clock").textContent = "北京 " + fmtCSTDate(getCSTDate()).substring(11,19);
}, 1000);

// ════════════════════════════════════════════
// IndexedDB
// ════════════════════════════════════════════
let db;
function openDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("snapshots")) {
        const s = d.createObjectStore("snapshots", { keyPath:"id", autoIncrement:true });
        s.createIndex("ts","ts",{ unique: true });
      } else {
        // v1→v2: recreate ts index with unique:true
        const tx = e.target.transaction;
        const s = tx.objectStore("snapshots");
        if (s.indexNames.contains("ts")) s.deleteIndex("ts");
        s.createIndex("ts","ts",{ unique: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => { console.error("IndexedDB open error:", e.target.error); rej(e.target.error); };
    req.onblocked = () => { console.warn("IndexedDB upgrade blocked — close other tabs of this app and reload"); };
  });
}
function dbAdd(store, data) {
  return new Promise((res,rej) => {
    const tx = db.transaction(store,"readwrite");
    const r = tx.objectStore(store).add(data);
    r.onsuccess = () => res(r.result);
    r.onerror   = e => rej(e.target.error);
  });
}
// put = insert or overwrite（用于云端恢复，避免 id 冲突）
// ts 索引是 unique 的；如果 ts 已存在则静默跳过（返回 null）
function dbPut(store, data) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readwrite");
    const { id: _drop, ...dataNoId } = data;
    const r = tx.objectStore(store).put(dataNoId);
    r.onsuccess = () => res(r.result);
    r.onerror = e => {
      if (e.target.error && e.target.error.name === "ConstraintError") {
        e.preventDefault();  // prevent transaction abort
        tx.abort();
        res(null);           // ts already exists — skip silently
      } else {
        rej(e.target.error);
      }
    };
  });
}
function dbGetAll(store) {
  return new Promise((res,rej) => {
    const tx = db.transaction(store,"readonly");
    const r  = tx.objectStore(store).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror   = e => rej(e.target.error);
  });
}
function dbClear(store) {
  return new Promise((res,rej) => {
    const tx = db.transaction(store,"readwrite");
    const r  = tx.objectStore(store).clear();
    r.onsuccess = () => res();
    r.onerror   = e => rej(e.target.error);
  });
}

// ════════════════════════════════════════════
// 数据抓取  (ranks 1-9: 1st excluded from cards, 2-4 main, 5-9 watch)
// ════════════════════════════════════════════
async function fetchVotes() {
  const t = Date.now();
  const url = `https://cf2026.one1seven799.workers.dev/?t=${t}`;
  const resp = await fetch(url, { signal: AbortSignal.timeout(12000) });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}，请确认 proxy.py 正在运行`);
  const data = await resp.json();
  if (data.errno !== 0) throw new Error(data.errmsg || "API错误");
  const rows = [];
  for (const p of data.data.vote_list) {
    const voteOpt = p.option_name.find(o => o.option_name === "夯爆了");
    const votes = voteOpt ? voteOpt.option_vote_number : 0;
    rows.push({ name: p.vote_name, votes });
  }
  rows.sort((a,b) => b.votes - a.votes);
  rows.forEach((r,i) => r.rank = i+1);
  return rows; // return ALL ranks, we'll slice as needed
}

// ════════════════════════════════════════════
// State
// ════════════════════════════════════════════
let running = false, timerId = null, countdownId = null, nextFetchAt = null;
let allSnapshots = [];
// granularity: "1min" | "5min" | "10min" | "hour"
let granularity = "1min";
// trend chart mode: "bar" | "line"
let trendMode = "bar";
// delta chart mode: "bar" | "line"
let deltaMode = "bar";
// daily chart mode: "bar" | "line"
let dailyChartMode = "bar";
// summary bar window: 1 | 5 | 10 | 60 (minutes)
let summaryWindow = 1;
// notify tab: "all" | "1min" | "5min" | "10min" | "hour"
let notifyTab = "all";

// Per-granularity notify histories (stored separately in memory)
// notifyLines = all entries; notifyLines1min, notifyLines5min, notifyLines10min, notifyLinesHour
const notifyLines = [];
const notifyLines1min  = [];
const notifyLines5min  = [];
const notifyLines10min = [];
const notifyLinesHour  = [];

// ════════════════════════════════════════════
// Alert toast
// ════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("alert-toast");
  el.textContent = msg;
  el.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 8000);
}

// ════════════════════════════════════════════
// Main fetch loop
// ════════════════════════════════════════════
async function doFetch() {
  setStatus("running","抓取中…");
  try {
    const cst   = getCSTDate();
    const tsStr = fmtCSTDate(cst);
    const allRows = await fetchVotes();

    // Split rows
    const mainRows  = allRows.filter(r => r.rank >= 2 && r.rank <= 4);  // cards
    const watchRows = allRows.filter(r => r.rank >= 5 && r.rank <= 9);  // silent watch

    // Find prev + hourStart snapshots
    let prevSnap = null, hourStartSnap = null;
    if (allSnapshots.length > 0) {
      prevSnap = allSnapshots[allSnapshots.length-1];
      const curHourPrefix = tsStr.substring(0,13);
      hourStartSnap = allSnapshots.find(s => s.ts.startsWith(curHourPrefix)) || prevSnap;
    }
    const isNewHour = prevSnap && prevSnap.ts.substring(0,13) !== tsStr.substring(0,13);

    // Save snap (rows = main 2-4, watchRows = 5-9)
    const snap = {
      ts: tsStr,
      rows: mainRows,
      watchRows,
      prevTs: prevSnap?.ts || null,
      hourStartTs: hourStartSnap?.ts || null
    };
    await dbAdd("snapshots", snap);
    snap.id = allSnapshots.length + 1;
    allSnapshots.push(snap);

    // Queue for cloud sync
    kvPendingSnaps.push(snap);
    scheduleKVSync();

    // Check for watchlist surges
    checkWatchSurge(watchRows, prevSnap, mainRows);

    // Notify text
    const notify = buildNotify(mainRows, watchRows, prevSnap, hourStartSnap, tsStr, isNewHour);

    // Build per-granularity notify summaries
    buildGranularNotifies(mainRows, prevSnap, hourStartSnap, tsStr, isNewHour);

    // Update UI
    renderCards(mainRows, prevSnap, hourStartSnap, tsStr);
    renderSummaryBar(mainRows, tsStr);
    renderWatchlist(watchRows, prevSnap);
    renderDiffRow(allRows);
    prependNotify(notify, tsStr, null);
    renderHistoryTable();
    renderDailyPanel();
    renderAllCharts();
    document.getElementById("last-update-label").textContent = `更新于 ${tsStr.substring(11,16)}`;
    document.getElementById("total-count").textContent = allSnapshots.length + " 次";

    setStatus(running ? "running" : "paused", running ? "追踪中" : "已暂停");
  } catch(err) {
    console.error(err);
    appendNotifyError(err.message);
    setStatus(running ? "running" : "paused", running ? "追踪中（上次失败）" : "失败");
  }
}

// ════════════════════════════════════════════
// 5-9名异常涨幅检测
// ════════════════════════════════════════════
function checkWatchSurge(watchRows, prevSnap, mainRows) {
  if (!prevSnap || !watchRows.length) return;
  const prevMap = Object.fromEntries((prevSnap.watchRows||[]).map(r=>[r.name,r.votes]));
  const fourth = mainRows[2]; // current rank-4 person
  for (const r of watchRows) {
    const prev = prevMap[r.name];
    if (prev === undefined) continue;
    const delta = r.votes - prev;
    // Check if surging enough to threaten rank 4
    if (delta >= ALERT_WATCH_10MIN) {
      const gap = fourth ? r.votes - fourth.votes : null;
      if (gap !== null && gap > -50000) {
        // Within striking distance of 4th
        showToast(`🚨 ${r.name}（当前第${r.rank}名）涨幅异常！+${delta.toLocaleString()} 票，距第4名仅 ${Math.abs(gap).toLocaleString()} 票！`);
        appendWatchAlert(r, delta, gap);
      } else if (gap !== null) {
        // Big surge but not immediately threatening
        showToast(`⚠️ ${r.name}（第${r.rank}名）异常加速 +${delta.toLocaleString()} 票，需注意！`);
      }
    }
  }
}

function appendWatchAlert(r, delta, gap) {
  const msg = `⚡ 【冲榜预警】${r.name} 当前第${r.rank}名  10分钟涨 +${delta.toLocaleString()}票  距第4名仅 ${gap >= 0 ? "已超越" : Math.abs(gap).toLocaleString()+"票"}`;
  notifyLines.unshift({ text: msg, tsStr: fmtCSTDate(getCSTDate()), isWarn: true });
  refreshNotifyFeed();
}

// ════════════════════════════════════════════
// 通知构建
// ════════════════════════════════════════════
function buildNotify(rows, watchRows, prevSnap, hourStartSnap, tsStr, isNewHour) {
  const prev      = prevSnap      ? Object.fromEntries(prevSnap.rows.map(r=>[r.name,r.votes])) : null;
  const hourStart = hourStartSnap ? Object.fromEntries(hourStartSnap.rows.map(r=>[r.name,r.votes])) : null;
  const range10   = prevSnap ? `${hm(prevSnap.ts)}→${hm(tsStr)}` : "首次";
  const rangeHr   = hourStartSnap ? `${hm(hourStartSnap.ts)}→${hm(tsStr)}` : "本小时";

  let lines = [`【乘风2026 投票播报】${tsStr}（北京时间）`, "─".repeat(36)];
  let alerts = [];

  for (const r of rows) {
    const g10 = prev      ? r.votes - (prev[r.name]      ?? r.votes) : null;
    const gHr = hourStart ? r.votes - (hourStart[r.name] ?? r.votes) : null;
    const f10 = (g10 !== null && g10 >= ALERT_10MIN)  ? " 🚨超速!" : "";
    const fHr = (gHr !== null && gHr >= ALERT_HOURLY) ? " 🚨爆量!" : "";
    if (g10 !== null && gHr !== null) {
      lines.push(`第${r.rank}名 ${r.name}  票数 ${r.votes.toLocaleString()}  |  ${range10} 涨 ${g10>=0?"+":""}${g10.toLocaleString()}${f10}  |  ${rangeHr} 小时累计 ${gHr>=0?"+":""}${gHr.toLocaleString()}${fHr}`);
    } else {
      lines.push(`第${r.rank}名 ${r.name}  票数 ${r.votes.toLocaleString()}  （首次记录）`);
    }
    if (f10) alerts.push(`⚠️ ${r.name} 10分钟涨 ${g10.toLocaleString()} 票！超预警线 ${ALERT_10MIN.toLocaleString()}`);
    if (fHr) alerts.push(`⚠️ ${r.name} 小时累计 ${gHr.toLocaleString()} 票！超预警线 ${ALERT_HOURLY.toLocaleString()}`);
  }
  if (rows.length >= 3)
    lines.push(`第2→3差：${(rows[0].votes-rows[1].votes).toLocaleString()} 票  │  第3→4差：${(rows[1].votes-rows[2].votes).toLocaleString()} 票`);
  if (alerts.length) { lines.push("─".repeat(36)); lines = lines.concat(alerts); }
  if (isNewHour) lines.push("🕐 整点跨越，已记录小时报告");
  return lines.join("\n");
}

// ════════════════════════════════════════════
// 按粒度构建播报（1分/5分/10分/小时）
// ════════════════════════════════════════════
function buildGranularNotifies(rows, prevSnap, hourStartSnap, tsStr, isNewHour) {
  if (!prevSnap) return;

  // Helper: find snap approximately N minutes before current
  function snapNMinBefore(minutes) {
    const cutMs = new Date(tsStr.replace(" ","T")+"Z").getTime() - minutes * 60 * 1000;
    // find closest snap at or before cutoff
    let best = null;
    for (const s of allSnapshots) {
      const sMs = new Date(s.ts.replace(" ","T")+"Z").getTime();
      if (sMs <= cutMs) best = s;
    }
    return best;
  }

  function buildLines(rows, refSnap, rangeLabel, granTag) {
    if (!refSnap) return;
    const refMap = Object.fromEntries(refSnap.rows.map(r=>[r.name,r.votes]));
    const lines = [`【${granTag} 涨幅播报】${tsStr.substring(11,16)}（北京时间）`, `区间：${hm(refSnap.ts)}→${hm(tsStr)}`,"─".repeat(28)];
    let hasAlert = false;
    for (const r of rows) {
      const rv = refMap[r.name];
      if (rv === undefined) continue;
      const delta = r.votes - rv;
      const f = (granTag==="10分钟"&&delta>=ALERT_10MIN)||(granTag==="1小时"&&delta>=ALERT_HOURLY) ? " 🚨" : "";
      if (f) hasAlert = true;
      lines.push(`#${r.rank} ${r.name}  ${r.votes.toLocaleString()}  涨 ${delta>=0?"+":""}${delta.toLocaleString()}${f}`);
    }
    if (rows.length>=3) lines.push(`2→3差：${(rows[0].votes-rows[1].votes).toLocaleString()}  3→4差：${(rows[1].votes-rows[2].votes).toLocaleString()}`);
    return lines.join("\n");
  }

  // 1分钟: vs immediately previous snap
  const snap1min = prevSnap;
  const text1 = buildLines(rows, snap1min, "1分钟", "1分钟");
  if (text1) notifyLines1min.unshift({ text:text1, tsStr });

  // 5分钟: find snap ~5min ago
  const snap5min = snapNMinBefore(5);
  if (snap5min && snap5min.ts !== snap1min?.ts) {
    const text5 = buildLines(rows, snap5min, "5分钟", "5分钟");
    if (text5) notifyLines5min.unshift({ text:text5, tsStr });
  } else if (snap5min) {
    const text5 = buildLines(rows, snap5min, "5分钟", "5分钟");
    if (text5) notifyLines5min.unshift({ text:text5, tsStr });
  }

  // 10分钟: find snap ~10min ago
  const snap10min = snapNMinBefore(10);
  if (snap10min) {
    const text10 = buildLines(rows, snap10min, "10分钟", "10分钟");
    if (text10) notifyLines10min.unshift({ text:text10, tsStr });
  }

  // 小时: only push on new hour or first of hour
  if (isNewHour && hourStartSnap) {
    const textHr = buildLines(rows, hourStartSnap, "1小时", "1小时");
    if (textHr) notifyLinesHour.unshift({ text:textHr, tsStr });
  }

  // Trim all lists to 50 entries
  [notifyLines1min,notifyLines5min,notifyLines10min,notifyLinesHour].forEach(l => { if(l.length>50) l.length=50; });
  if (notifyTab !== "all") refreshNotifyFeed();
}


function renderSummaryBar(rows, tsStr) {
  const bar = document.getElementById("summary-bar");
  const grid = document.getElementById("summary-grid");
  if (!rows || !rows.length) { bar.style.display = "none"; return; }
  bar.style.display = "";

  const windowMs = summaryWindow * 60 * 1000;
  const cutoffTs = fmtCSTDate(new Date(Date.now() - windowMs + 8*3600*1000));
  // find the snapshot closest to (now - window)
  const snapBefore = [...allSnapshots].reverse().find(s => s.ts <= cutoffTs) ||
                     (allSnapshots.length > 1 ? allSnapshots[0] : null);

  const prevMap = snapBefore ? Object.fromEntries(snapBefore.rows.map(r=>[r.name,r.votes])) : {};

  grid.innerHTML = rows.map(r => {
    const pv = prevMap[r.name];
    const delta = pv !== undefined ? r.votes - pv : null;
    const deltaStr = delta !== null ? `${delta>=0?"+":""}${delta.toLocaleString()}` : "—";
    const cls = delta === null ? "neutral" : delta > 0 ? "pos" : delta < 0 ? "neg" : "neutral";
    // rate per minute
    let rateStr = "";
    if (delta !== null && snapBefore) {
      const dtMs = new Date(tsStr.replace(" ","T")+"Z").getTime() - new Date(snapBefore.ts.replace(" ","T")+"Z").getTime();
      const mins = dtMs / 60000;
      if (mins > 0) {
        const perMin = Math.round(delta / mins);
        rateStr = `${perMin>=0?"+":""}${perMin.toLocaleString()}/分`;
      }
    }
    const isAlert = delta !== null && delta >= ALERT_10MIN * (summaryWindow / 10);
    return `<div class="summary-card">
      <div class="summary-card-left">
        <span class="summary-card-rank"># ${r.rank}</span>
        <span class="summary-card-name">${r.name}</span>
        <span class="summary-card-votes">${r.votes.toLocaleString()} 票</span>
      </div>
      <div class="summary-card-right">
        <span class="summary-delta-big ${cls}">${deltaStr}</span>
        ${rateStr ? `<span class="summary-rate">${rateStr}</span>` : ""}
        ${isAlert ? `<span class="summary-alert-tag">🚨 超速</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

// UI: cards
// ════════════════════════════════════════════
function renderCards(rows, prevSnap, hourStartSnap, tsStr) {
  const hourStart = hourStartSnap ? Object.fromEntries(hourStartSnap.rows.map(r=>[r.name,r.votes])) : null;
  // find snap ~INTERVAL_MS before tsStr for interval delta
  let intervalSnap = prevSnap;
  if (tsStr && allSnapshots.length > 1) {
    const cutMs = new Date(tsStr.replace(" ","T")+"Z").getTime() - INTERVAL_MS;
    let best = null;
    for (const s of allSnapshots) {
      if (new Date(s.ts.replace(" ","T")+"Z").getTime() <= cutMs) best = s;
    }
    if (best) intervalSnap = best;
  }
  const mins = Math.round(INTERVAL_MS / 60000);
  const intervalLabel = `${mins}分钟涨幅`;
  const prev = intervalSnap ? Object.fromEntries(intervalSnap.rows.map(r=>[r.name,r.votes])) : null;
  const grid = document.getElementById("rank-grid");
  grid.innerHTML = "";
  for (const r of rows) {
    const g10  = prev      ? r.votes - (prev[r.name]      ?? r.votes) : null;
    const gHr  = hourStart ? r.votes - (hourStart[r.name] ?? r.votes) : null;
    const alert10 = g10 !== null && g10 >= ALERT_10MIN;
    const alertHr = gHr !== null && gHr >= ALERT_HOURLY;
    const hasAlert = alert10 || alertHr;

    const card = document.createElement("div");
    card.className = "rank-card" + (hasAlert ? " alert" : "");

    const g10Str = g10 !== null ? `${g10>=0?"+":""}${g10.toLocaleString()}` : "首次";
    const g10Cls = g10 === null ? "neutral" : g10 > 0 ? "pos" : g10 < 0 ? "neg" : "neutral";
    const gHrStr = gHr !== null ? `${gHr>=0?"+":""}${gHr.toLocaleString()}` : "—";
    const gHrCls = gHr === null ? "neutral" : gHr > 0 ? "pos" : gHr < 0 ? "neg" : "neutral";

    card.innerHTML = `
      <span class="rank-badge"># ${r.rank}</span>
      <div class="rank-name">${r.name}</div>
      <div class="rank-votes">${r.votes.toLocaleString()}</div>
      <div class="rank-deltas">
        <div class="delta-row">
          <span class="delta-label">${intervalLabel}</span>
          <span class="delta-val ${g10Cls}">${g10Str}</span>
        </div>
        <div class="delta-row">
          <span class="delta-label">小时累计</span>
          <span class="delta-val ${gHrCls}">${gHrStr}</span>
        </div>
      </div>
      ${alert10 ? `<div class="alert-badge">🚨 超速 ${g10.toLocaleString()}</div>` : ""}
      ${alertHr ? `<div class="alert-badge">🚨 爆量 ${gHr.toLocaleString()}</div>` : ""}
    `;
    grid.appendChild(card);
  }
  document.getElementById("diff-row").style.display = "";
}

  // recorded days
  const allDays = [...new Set(allSnapshots.map(s=>s.ts.substring(0,10)))].sort();
  document.getElementById("recorded-days").textContent = allDays.length ? `${allDays.length} 天` : "—";

  const todayPrefix = fmtCSTDate(getCSTDate()).substring(0,10);
  const todayFirst  = allSnapshots.find(s => s.ts.startsWith(todayPrefix));
  document.getElementById("today-first").textContent = todayFirst ? hm(todayFirst.ts) : "—";

  const sel = document.getElementById("history-date-filter");

  sel.innerHTML = '<option value="all">全部日期</option><option value="today">今天</option>';

      const opt = document.createElement("option");

  else sel.value = "today";
}

// ════════════════════════════════════════════
// UI: daily summary panel
// ════════════════════════════════════════════
function getDailyStats() {
  // group snapshots by date, then compute first/last votes per person per day
  const dayMap = {};
  for (const snap of allSnapshots) {
    const d = snap.ts.substring(0,10);
    if (!dayMap[d]) dayMap[d] = [];
    dayMap[d].push(snap);
  }
  const days = Object.keys(dayMap).sort();
  const result = []; // [{date, name, startVotes, endVotes, gain, count}]
  for (const d of days) {
    const snaps = dayMap[d].sort((a,b)=>a.ts.localeCompare(b.ts));
    const first = snaps[0], last = snaps[snaps.length-1];
    const names = [...new Set([...first.rows.map(r=>r.name), ...last.rows.map(r=>r.name)])];
    const firstMap = Object.fromEntries(first.rows.map(r=>[r.name,{votes:r.votes,rank:r.rank}]));
    const lastMap  = Object.fromEntries(last.rows.map(r=>[r.name,{votes:r.votes,rank:r.rank}]));
    for (const nm of names) {
      const sv = firstMap[nm]?.votes;
      const ev = lastMap[nm]?.votes;
      const rank = lastMap[nm]?.rank ?? firstMap[nm]?.rank;
      if (sv !== undefined && ev !== undefined) {
        result.push({ date:d, name:nm, rank, startVotes:sv, endVotes:ev, gain:ev-sv, count:snaps.length });
      }
    }
  }
  return result;
}

function renderDailyPanel() {
  const stats = getDailyStats();
  const title  = document.getElementById("daily-title");
  const panel  = document.getElementById("daily-panel");
  const tbody  = document.getElementById("daily-tbody");
  const subtitle = document.getElementById("daily-subtitle");

  if (!stats.length) { title.style.display="none"; panel.style.display="none"; return; }

  const days = [...new Set(stats.map(s=>s.date))];
  title.style.display="";
  panel.style.display="";
  subtitle.textContent = `${days.length} 天`;

  let html = "";
  for (const d of days.slice().reverse()) {
    const rows = stats.filter(s=>s.date===d).sort((a,b)=>a.rank-b.rank);
    rows.forEach((s, i) => {
      const gainStr = `${s.gain>=0?"+":""}${s.gain.toLocaleString()}`;
      const gainCls = s.gain>0?"td-pos":s.gain<0?"td-neg":"td-neutral";
      html += `<tr>
        ${i===0 ? `<td rowspan="${rows.length}" class="td-mono" style="vertical-align:middle;border-right:1px solid var(--border)"><span class="day-badge">${d}</span><br><span style="font-size:0.65rem;color:var(--text3)">${s.count}条记录</span></td>` : ""}
        <td>#${s.rank} ${s.name}</td>
        <td class="td-mono td-neutral">${s.startVotes.toLocaleString()}</td>
        <td class="td-mono">${s.endVotes.toLocaleString()}</td>
        <td class="td-mono ${gainCls}" style="font-weight:600">${gainStr}</td>
        ${i===0 ? `<td rowspan="${rows.length}" class="td-mono td-neutral" style="vertical-align:middle;text-align:center">${s.count}</td>` : ""}
      </tr>`;
    });
  }
  tbody.innerHTML = html || "<tr><td colspan='6' style='text-align:center;color:var(--text3);padding:16px'>暂无数据</td></tr>";
}

// ════════════════════════════════════════════
// UI: history table (with date filter)
// ════════════════════════════════════════════
function renderHistoryTable() {
  const wrap = document.getElementById("history-wrap");
  const count = document.getElementById("history-count");
  const filterVal = document.getElementById("history-date-filter")?.value || "all";
  const todayPrefix = fmtCSTDate(getCSTDate()).substring(0,10);
  const datePrefix = filterVal === "today" ? todayPrefix : filterVal === "all" ? null : filterVal;

  let filtered = allSnapshots;
  if (datePrefix) filtered = allSnapshots.filter(s => s.ts.startsWith(datePrefix));

  const recent = filtered.slice(-60).reverse(); // show up to 60 rows per day
  count.textContent = `共 ${allSnapshots.length} 条 · 显示 ${filtered.length} 条`;
  if (!recent.length) { wrap.innerHTML = '<div class="empty-state"><p>该日期暂无记录</p></div>'; return; }

  let html = `<table class="history-table"><thead><tr>
    <th>时间(北京)</th><th>姓名</th><th>排名</th><th>票数</th><th>间隔涨幅</th><th>小时涨幅</th><th>预警</th>
  </tr></thead><tbody>`;

  for (const snap of recent) {
    const prevSnap = allSnapshots.find(s => s.ts === snap.prevTs);
    const hourSnap = allSnapshots.find(s => s.ts === snap.hourStartTs);
    const prev      = prevSnap ? Object.fromEntries(prevSnap.rows.map(r=>[r.name,r.votes])) : null;
    const hourStart = hourSnap ? Object.fromEntries(hourSnap.rows.map(r=>[r.name,r.votes])) : null;

    for (const r of snap.rows) {
      const g10  = prev      ? r.votes-(prev[r.name]??r.votes) : null;
      const gHr  = hourStart ? r.votes-(hourStart[r.name]??r.votes) : null;
      const g10Str = g10 !== null ? `${g10>=0?"+":""}${g10.toLocaleString()}` : "首次";
      const gHrStr = gHr !== null ? `${gHr>=0?"+":""}${gHr.toLocaleString()}` : "—";
      const g10Cls = g10===null?"td-neutral":g10>0?"td-pos":g10<0?"td-neg":"";
      const gHrCls = gHr===null?"td-neutral":gHr>0?"td-pos":gHr<0?"td-neg":"";
      const alerts = [];
      if (g10!==null && g10>=ALERT_10MIN)  alerts.push('<span class="td-alert">超速</span>');
      if (gHr!==null && gHr>=ALERT_HOURLY) alerts.push('<span class="td-alert">爆量</span>');
      html += `<tr>
        <td class="td-mono">${snap.ts.substring(5,16)}</td>
        <td>${r.name}</td>
        <td class="td-neutral td-mono">${r.rank}</td>
        <td class="td-mono">${r.votes.toLocaleString()}</td>
        <td class="td-mono ${g10Cls}">${g10Str}</td>
        <td class="td-mono ${gHrCls}">${gHrStr}</td>
        <td>${alerts.join(" ")}</td>
      </tr>`;
    }
  }
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

// Notify feed
// ════════════════════════════════════════════
function setNotifyTab(tab) {
  notifyTab = tab;
  ["all","1min","5min","10min","hour"].forEach(t => {
    const el = document.getElementById("notify-tab-"+t);
    if (el) el.classList.toggle("active", t === tab);
  });
  refreshNotifyFeed();
}

function prependNotify(text, tsStr, granTag) {
  // granTag: "1min" | "5min" | "10min" | "hour" | undefined (= all)
  const entry = { text, tsStr };
  notifyLines.unshift(entry);
  if (granTag === "1min")  notifyLines1min.unshift(entry);
  if (granTag === "5min")  notifyLines5min.unshift(entry);
  if (granTag === "10min") notifyLines10min.unshift(entry);
  if (granTag === "hour")  notifyLinesHour.unshift(entry);
  if (!granTag) { notifyLines1min.unshift(entry); notifyLines5min.unshift(entry); notifyLines10min.unshift(entry); }
  refreshNotifyFeed();
}
function appendNotifyError(msg) {
  const entry = { text:`❌ 抓取失败：${msg}`, tsStr:fmtCSTDate(getCSTDate()), isErr:true };
  notifyLines.unshift(entry);
  refreshNotifyFeed();
}
function refreshNotifyFeed() {
  const feed = document.getElementById("notify-feed");
  const list = notifyTab === "all"   ? notifyLines
             : notifyTab === "1min"  ? notifyLines1min
             : notifyTab === "5min"  ? notifyLines5min
             : notifyTab === "10min" ? notifyLines10min
             :                        notifyLinesHour;
  if (!list.length) {
    feed.innerHTML = '<div class="empty-state" style="padding:20px 0"><p>暂无播报记录</p></div>';
    return;
  }
  feed.innerHTML = list.slice(0,20).map(entry => {
    const lines = entry.text.split("\n");
    const rendered = lines.map(l => {
      if (l.startsWith("─")||l.startsWith("═")) return `<span class="nf-sep">${l}</span>`;
      if (l.includes("🚨")) return `<span class="nf-alert">${l}</span>`;
      if (l.includes("⚡")) return `<span class="nf-warn">${l}</span>`;
      if (l.startsWith("【")) return `<span class="nf-info">${l}</span>`;
      if (l.startsWith("🕐")) return `<span class="nf-info">${l}</span>`;
      if (l.startsWith("❌")) return `<span class="nf-alert">${l}</span>`;
      return l;
    }).join("<br>");
    return `<div class="notify-entry">${rendered}</div>`;
  }).join("");
  feed.scrollTop = 0;
}

// ════════════════════════════════════════════
// Countdown
// ════════════════════════════════════════════
function startCountdown() {
  nextFetchAt = Date.now() + INTERVAL_MS;
  if (countdownId) clearInterval(countdownId);
  countdownId = setInterval(() => {
    const remaining = Math.max(0, nextFetchAt - Date.now());
    const mins = String(Math.floor(remaining/60000)).padStart(2,'0');
    const secs = String(Math.floor((remaining%60000)/1000)).padStart(2,'0');
    document.getElementById("countdown-timer").textContent = `${mins}:${secs}`;
    const pct = ((INTERVAL_MS-remaining)/INTERVAL_MS*100).toFixed(1);
    document.getElementById("progress-fill").style.width = pct+"%";
  },1000);
}

function setStatus(type, text) {
  const pill = document.getElementById("status-pill");
  pill.className = "status-pill "+type;
  document.getElementById("status-text").textContent = text;
}

async function startTracking() {
  INTERVAL_MS = parseInt(document.getElementById("interval-select").value);
  running = true;
  document.getElementById("btn-toggle").textContent = "暂停";
  setStatus("running","追踪中");
  await doFetch();
  startCountdown();
  timerId = setInterval(async() => {
    if (!running) return;
    await doFetch();
    startCountdown();
  }, INTERVAL_MS);
}

function stopTracking() {
  running = false;
  if (timerId) { clearInterval(timerId); timerId=null; }
  if (countdownId) { clearInterval(countdownId); countdownId=null; }
  document.getElementById("btn-toggle").textContent = "启动";
  document.getElementById("countdown-timer").textContent = "—";
  document.getElementById("progress-fill").style.width = "0%";
  setStatus("paused","已暂停");
}

// ════════════════════════════════════════════
// Export CSV
// ════════════════════════════════════════════
function csvEscape(v) {
  const s = String(v);
  return s.includes(",")||s.includes('"')||s.includes("\n") ? `"${s.replace(/"/g,'""')}"` : s;
}
function makeCSV(headers,rows) {
  return [headers,...rows].map(r=>r.map(csvEscape).join(",")).join("\n");
}

function exportCSV(type) {
  let content = "";
  const now = fmtCSTDate(getCSTDate()).replace(/[: ]/g,"-");

  if (type==="raw") {
    const headers = ["时间(北京)","排名","姓名","夯爆了票数"];
    const rows=[];
    for (const snap of allSnapshots)
      for (const r of snap.rows)
        rows.push([snap.ts,r.rank,r.name,r.votes]);
    content = makeCSV(headers,rows);
  } else if (type==="live") {
    const mins = Math.round(INTERVAL_MS / 60000);
    const headers = ["时间(北京)","姓名","排名","当前票数",`${mins}分钟涨幅`,`${mins}分钟区间`,"小时累计涨幅","小时区间","间隔预警","小时预警"];
    const rows=[];
    for (const snap of allSnapshots) {
      const snapMs = new Date(snap.ts.replace(" ","T")+"Z").getTime();
      const cutMs = snapMs - INTERVAL_MS;
      let intSnap = null;
      for (const s of allSnapshots) {
        if (new Date(s.ts.replace(" ","T")+"Z").getTime() <= cutMs) intSnap = s;
      }
      if (!intSnap) intSnap = allSnapshots.find(s=>s.ts===snap.prevTs) || null;
      const hourSnap = allSnapshots.find(s=>s.ts===snap.hourStartTs);
      const prev      = intSnap   ? Object.fromEntries(intSnap.rows.map(r=>[r.name,r.votes])) : null;
      const hourStart = hourSnap  ? Object.fromEntries(hourSnap.rows.map(r=>[r.name,r.votes])) : null;
      const rangeInt = intSnap  ? `${hm(intSnap.ts)}→${hm(snap.ts)}` : "首次";
      const rangeHr  = hourSnap ? `${hm(hourSnap.ts)}→${hm(snap.ts)}` : "—";
      for (const r of snap.rows) {
        const gInt = prev      ? r.votes-(prev[r.name]??r.votes) : "—";
        const gHr  = hourStart ? r.votes-(hourStart[r.name]??r.votes) : "—";
        rows.push([snap.ts,r.name,r.rank,r.votes,gInt,rangeInt,gHr,rangeHr,
          typeof gInt==="number"&&gInt>=ALERT_10MIN?"🚨超速":"",
          typeof gHr==="number"&&gHr>=ALERT_HOURLY?"🚨爆量":""]);
      }
    }
    content = makeCSV(headers,rows);
  } else if (type==="live5") {
    // 5-minute flow uses cloud snapshots (saved every 5 min by Worker cron) merged with local.
    // Fetch cloud data first, then build CSV asynchronously.
    (async () => {
      let cloudSnaps = [];
      try {
        const resp = await fetch(`${WORKER_URL}/snapshots`, { signal: AbortSignal.timeout(15000) });
        const j = await resp.json();
        if (j.ok && Array.isArray(j.snapshots)) cloudSnaps = j.snapshots;
      } catch(e) { console.warn("云端拉取失败，仅用本地数据:", e.message); }

      // Merge cloud + local, deduplicate by ts, sort ascending
      const merged = [...cloudSnaps];
      const cloudTsSet = new Set(cloudSnaps.map(s=>s.ts));
      for (const s of allSnapshots) { if (!cloudTsSet.has(s.ts)) merged.push(s); }
      merged.sort((a,b)=>a.ts.localeCompare(b.ts));

      // Keep only one snap per 5-min bucket (last snap in bucket wins)
      const bucketMap = {};
      for (const snap of merged) {
        const m = snap.ts.substring(14,16);
        const bucket = snap.ts.substring(0,14) + String(Math.floor(parseInt(m)/5)*5).padStart(2,'0');
        bucketMap[bucket] = snap;
      }
      const bucketSnaps = Object.values(bucketMap).sort((a,b)=>a.ts.localeCompare(b.ts));

      // Build hourStartTs lookup from merged list
      function findHourSnap(snap) {
        if (snap.hourStartTs) {
          const hs = merged.find(s=>s.ts===snap.hourStartTs);
          if (hs) return hs;
        }
        // fallback: first snap of same hour in merged
        const prefix = snap.ts.substring(0,13);
        return merged.find(s=>s.ts.startsWith(prefix)) || null;
      }

      const headers5 = ["时间(北京)","姓名","排名","当前票数","5分钟涨幅","5分钟区间","小时累计涨幅","小时区间","数据来源","预警"];
      const rows5=[];
      for (let i=0; i<bucketSnaps.length; i++) {
        const snap = bucketSnaps[i];
        const prev5 = i>0 ? bucketSnaps[i-1] : null;
        const hourSnap = findHourSnap(snap);
        const prev5Map  = prev5    ? Object.fromEntries(prev5.rows.map(r=>[r.name,r.votes])) : null;
        const hourStart = hourSnap ? Object.fromEntries(hourSnap.rows.map(r=>[r.name,r.votes])) : null;
        const range5  = prev5    ? `${hm(prev5.ts)}→${hm(snap.ts)}` : "首次";
        const rangeHr = hourSnap ? `${hm(hourSnap.ts)}→${hm(snap.ts)}` : "—";
        const src = cloudTsSet.has(snap.ts) ? "云端" : "本地";
        for (const r of snap.rows) {
          const g5  = prev5Map  ? r.votes-(prev5Map[r.name]??r.votes)  : "—";
          const gHr = hourStart ? r.votes-(hourStart[r.name]??r.votes) : "—";
          rows5.push([snap.ts,r.name,r.rank,r.votes,g5,range5,gHr,rangeHr,src,
            typeof g5==="number"&&g5>=ALERT_10MIN*0.5?"⚠️快速":""]);
        }
      }
      const csv5 = makeCSV(headers5, rows5);
      const now5 = fmtCSTDate(getCSTDate()).replace(/[: ]/g,"-");
      const fn5 = `乘风2026_5分钟流水(云端)_${now5}.csv`;
      saveViaProxy(`Data/${fn5}`,"﻿"+csv5,false).then(saved=>{
        if(!saved){const blob=new Blob(["﻿"+csv5],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn5;a.click();}
      });
    })();
    return;
  } else if (type==="daily") {
    const stats = getDailyStats();
    const headers = ["日期","排名","姓名","当日起始票数","当日结束票数","当日总涨幅","记录条数"];
    const rows = stats.map(s=>[s.date,s.rank,s.name,s.startVotes,s.endVotes,s.gain,s.count]);
    content = makeCSV(headers, rows);
  } else if (type==="hourly") {
    const headers=["时间(北京)","排名","姓名","夯爆了票数","小时涨幅","⚠️小时预警"];
    const rows=[];
    for (let i=1;i<allSnapshots.length;i++) {
      const cur=allSnapshots[i], prv=allSnapshots[i-1];
      if (cur.ts.substring(0,13)!==prv.ts.substring(0,13)) {
        const hourSnap=allSnapshots.find(s=>s.ts===prv.ts);
        for (const r of cur.rows) {
          const h0=hourSnap?(Object.fromEntries(hourSnap.rows.map(x=>[x.name,x.votes]))[r.name]??r.votes):r.votes;
          const hg=r.votes-h0;
          rows.push([cur.ts,r.rank,r.name,r.votes,hg,hg>=ALERT_HOURLY?"🚨爆量":""]);
        }
      }
    }
    content = makeCSV(headers,rows);
  } else if (type==="notify") {
    content = notifyLines.map(e=>e.text).join("\n\n")+"\n";
    const fn=`乘风2026_文字通知_${now}.txt`;
    saveViaProxy(`Data/${fn}`,"\uFEFF"+content,false).then(saved=>{
      if(!saved){const blob=new Blob(["\uFEFF"+content],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click();}
    });
    return;
  }

  const lbl=type==="raw"?"原始数据":type==="live"?"实时流水":type==="live5"?"5分钟流水":type==="daily"?"日报汇总":"每小时报告";
  const fn=`乘风2026_${lbl}_${now}.csv`;
  saveViaProxy(`Data/${fn}`,"\uFEFF"+content,false).then(saved=>{
    if(!saved){const blob=new Blob(["\uFEFF"+content],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click();}
  });
}

function exportChartImage(canvasId, label) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const legendEl = document.getElementById(canvasId === "canvas-trend" ? "legend-trend" : "legend-delta");
  const legendItems = [];
  if (legendEl) {
    legendEl.querySelectorAll(".legend-item").forEach(item => {
      const dot = item.querySelector(".legend-dot, .legend-rect");
      const text = item.textContent.trim();
      if (dot && text && !text.includes("个数据点")) {
        legendItems.push({ color: dot.style.background, text, isRect: dot.classList.contains("legend-rect") });
      }
    });
  }

  const EXPORT_SCALE = 4;
  const srcDpr = window.devicePixelRatio || 1;
  const cssW = parseInt(canvas.style.width)  || canvas.width  / srcDpr;
  const cssH = 280; // fixed height matching CSS
  const LEGEND_PAD = legendItems.length ? 56 : 0;
  const outW = cssW * EXPORT_SCALE;
  const outH = (cssH + LEGEND_PAD) * EXPORT_SCALE;

  const tmp = document.createElement("canvas");
  tmp.width = outW; tmp.height = outH;
  const ctx2 = tmp.getContext("2d");

  ctx2.fillStyle = "#ffffff";
  ctx2.fillRect(0, 0, outW, outH);
  ctx2.drawImage(canvas, 0, 0, outW, cssH * EXPORT_SCALE);

  if (legendItems.length) {
    const sc = EXPORT_SCALE;
    const baseY = cssH * sc + 18 * sc;
    let x = 60 * sc;
    ctx2.textBaseline = "middle";
    ctx2.font = `${15 * sc}px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif`;
    legendItems.forEach(item => {
      const sz = 12 * sc;
      ctx2.fillStyle = item.color;
      if (item.isRect) {
        ctx2.beginPath();
        if (ctx2.roundRect) ctx2.roundRect(x, baseY - sz/2, sz, sz, 2*sc);
        else ctx2.rect(x, baseY - sz/2, sz, sz);
        ctx2.fill();
      } else {
        ctx2.beginPath();
        ctx2.arc(x + sz/2, baseY, sz/2, 0, Math.PI*2);
        ctx2.fill();
      }
      ctx2.fillStyle = "#4a4a6a";
      ctx2.fillText(item.text, x + sz + 6*sc, baseY);
      x += ctx2.measureText(item.text).width + 28*sc;
    });
    const gran = granularity === "1min" ? "1分钟粒度" : granularity === "5min" ? "5分钟粒度" : granularity === "10min" ? "10分钟粒度" : "整小时粒度";
    ctx2.fillStyle = "#8888aa";
    ctx2.textAlign = "right";
    ctx2.fillText(gran, outW - 20*sc, baseY);
    ctx2.textAlign = "left";
  }

  const a = document.createElement("a");
  const now = fmtCSTDate(getCSTDate()).replace(/[: ]/g,"-");
  const fileName = `乘风2026_${label}_${now}.png`;
  const dataURL = tmp.toDataURL("image/png");
  const b64 = dataURL.split(",")[1];
  saveViaProxy(`Fig/${fileName}`, b64, true).then(saved => {
    if (!saved) { a.download = fileName; a.href = dataURL; a.click(); }
  });
}

// ════════════════════════════════════════════
// KV 云端同步
// ════════════════════════════════════════════
let kvSyncTimer = null;
let kvPendingSnaps = []; // snaps waiting to be uploaded

// Upload pending snapshots to KV (debounced 5s)
function scheduleKVSync() {
  if (kvSyncTimer) clearTimeout(kvSyncTimer);
  kvSyncTimer = setTimeout(flushKVSync, 5000);
}

async function flushKVSync() {
  if (!kvPendingSnaps.length) return;
  const batch = [...kvPendingSnaps];
  kvPendingSnaps = [];
  // 去掉 IndexedDB 自增 id，避免拉回时引发 ConstraintError
  const batchClean = batch.map(({ id: _drop, ...s }) => s);
  try {
    const resp = await fetch(`${WORKER_URL}/snapshots`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ snapshots: batchClean }),
      signal: AbortSignal.timeout(15000),
    });
    const j = await resp.json();
    if (j.ok) {
      console.log(`☁️ KV 已同步 ${j.saved} 条`);
    } else {
      console.warn("KV sync error:", j.error);
      // put back so they retry next time
      kvPendingSnaps.unshift(...batch);
    }
  } catch (e) {
    console.warn("KV sync failed:", e);
    kvPendingSnaps.unshift(...batch);
  }
}

// Load all snapshots from KV on startup
async function loadFromKV() {
  try {
    showToast("☁️ 正在从云端恢复历史数据…");
    const resp = await fetch(`${WORKER_URL}/snapshots`, {
      signal: AbortSignal.timeout(20000),
    });
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error);

    const remote = j.snapshots;
    if (!remote.length) { showToast("☁️ 云端暂无历史数据"); return; }

    // Deduplicate remote snapshots by ts (last entry wins) before merging
    const remoteDeduped = Object.values(
      remote.reduce((acc, s) => { acc[s.ts] = s; return acc; }, {})
    ).sort((a, b) => a.ts.localeCompare(b.ts));

    // Merge with local IndexedDB — remote wins for same ts
    const localTs = new Set(allSnapshots.map(s => s.ts));
    const addedTs = new Set(); // track ts added in this batch to prevent duplicate puts
    let added = 0;
    for (const snap of remoteDeduped) {
      if (!localTs.has(snap.ts) && !addedTs.has(snap.ts)) {
        const { id: _drop, ...snapNoId } = snap;
        const putResult = await dbPut("snapshots", snapNoId);
        if (putResult !== null) {
          allSnapshots.push(snapNoId);
          addedTs.add(snap.ts);
          added++;
        }
        // putResult === null means ts already existed — skip silently
      }
    }
    allSnapshots.sort((a, b) => a.ts.localeCompare(b.ts));
    showToast(`☁️ 云端恢复 ${added} 条历史记录`);

    // Refresh UI with loaded data
    if (allSnapshots.length > 0) {
      const last = allSnapshots[allSnapshots.length - 1];
      const prevSnap = allSnapshots.find(s => s.ts === last.prevTs);
      const hourSnap = allSnapshots.find(s => s.ts === last.hourStartTs);
      renderCards(last.rows, prevSnap, hourSnap, last.ts);
      renderSummaryBar(last.rows, last.ts);
      renderWatchlist(last.watchRows || [], prevSnap);
      renderDiffRow([...last.rows, ...(last.watchRows || [])]);
      document.getElementById("last-update-label").textContent = `更新于 ${last.ts.substring(11, 16)}`;
      document.getElementById("diff-row").style.display = "";
      document.getElementById("total-count").textContent = allSnapshots.length + " 次";
    }
    renderHistoryTable();
    renderDailyPanel();
    renderAllCharts();
    rebuildNotifyFromHistory();
  } catch (e) {
    console.warn("KV load failed:", e);
    showToast("☁️ 云端数据加载失败，使用本地缓存");
  }
}

// ════════════════════════════════════════════
// 从历史快照重建播报记录（云端恢复或本地加载后调用）
// ════════════════════════════════════════════
function rebuildNotifyFromHistory() {
  // 清空现有播报（避免重复）
  notifyLines.length = 0;
  notifyLines1min.length = 0;
  notifyLines5min.length = 0;
  notifyLines10min.length = 0;
  notifyLinesHour.length = 0;

  if (allSnapshots.length < 2) return;

  // 辅助：找 N 分钟前最近快照
  function snapNMinBefore(tsStr, minutes) {
    const cutMs = new Date(tsStr.replace(" ","T")+"Z").getTime() - minutes * 60 * 1000;
    let best = null;
    for (const s of allSnapshots) {
      const sMs = new Date(s.ts.replace(" ","T")+"Z").getTime();
      if (sMs <= cutMs) best = s;
      else break;
    }
    return best;
  }

  function buildLinesText(rows, refSnap, granTag, tsStr) {
    if (!refSnap) return null;
    const refMap = Object.fromEntries(refSnap.rows.map(r=>[r.name,r.votes]));
    const lines = [`【${granTag} 涨幅播报】${tsStr.substring(11,16)}（北京时间）`, `区间：${hm(refSnap.ts)}→${hm(tsStr)}`,"─".repeat(28)];
    let anyDelta = false;
    for (const r of rows) {
      const rv = refMap[r.name];
      if (rv === undefined) continue;
      const delta = r.votes - rv;
      anyDelta = true;
      const f = (granTag==="10分钟"&&delta>=ALERT_10MIN)||(granTag==="1小时"&&delta>=ALERT_HOURLY) ? " 🚨" : "";
      lines.push(`#${r.rank} ${r.name}  ${r.votes.toLocaleString()}  涨 ${delta>=0?"+":""}${delta.toLocaleString()}${f}`);
    }
    if (!anyDelta) return null;
    if (rows.length>=3) lines.push(`2→3差：${(rows[0].votes-rows[1].votes).toLocaleString()}  3→4差：${(rows[1].votes-rows[2].votes).toLocaleString()}`);
    return lines.join("\n");
  }

  // 只回放最近 50 条（避免太多）
  const snaps = allSnapshots.slice(-50);

  for (let i = 1; i < snaps.length; i++) {
    const snap = snaps[i];
    const rows = snap.rows;
    if (!rows || !rows.length) continue;
    const tsStr = snap.ts;

    const prevSnap = allSnapshots.find(s => s.ts === snap.prevTs) || snaps[i-1];
    const hourStartSnap = allSnapshots.find(s => s.ts === snap.hourStartTs);
    const isNewHour = prevSnap && prevSnap.ts.substring(0,13) !== tsStr.substring(0,13);

    // 全量播报（"全部"tab用）
    const notifyText = buildNotify(rows, snap.watchRows||[], prevSnap, hourStartSnap, tsStr, isNewHour);
    notifyLines.push({ text: notifyText, tsStr });

    // 1分钟
    const t1 = buildLinesText(rows, prevSnap, "1分钟", tsStr);
    if (t1) notifyLines1min.push({ text: t1, tsStr });

    // 5分钟
    const snap5 = snapNMinBefore(tsStr, 5);
    if (snap5) {
      const t5 = buildLinesText(rows, snap5, "5分钟", tsStr);
      if (t5) notifyLines5min.push({ text: t5, tsStr });
    }

    // 10分钟
    const snap10 = snapNMinBefore(tsStr, 10);
    if (snap10) {
      const t10 = buildLinesText(rows, snap10, "10分钟", tsStr);
      if (t10) notifyLines10min.push({ text: t10, tsStr });
    }

    // 小时播报（整点换小时时）
    if (isNewHour && hourStartSnap) {
      const tHr = buildLinesText(rows, hourStartSnap, "1小时", tsStr);
      if (tHr) notifyLinesHour.push({ text: tHr, tsStr });
    }
  }

  // 全部反转（最新在前），裁剪
  notifyLines.reverse();      if (notifyLines.length > 50)      notifyLines.length = 50;
  notifyLines1min.reverse();  if (notifyLines1min.length > 50)  notifyLines1min.length = 50;
  notifyLines5min.reverse();  if (notifyLines5min.length > 50)  notifyLines5min.length = 50;
  notifyLines10min.reverse(); if (notifyLines10min.length > 50) notifyLines10min.length = 50;
  notifyLinesHour.reverse();  if (notifyLinesHour.length > 50)  notifyLinesHour.length = 50;

  refreshNotifyFeed();
}
